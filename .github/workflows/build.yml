name: build

# Builds cisce-locator-saver.exe on Windows, tests it, and puts it on the "latest" release (Releases → latest → the .exe).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller pytest
      - name: Tests (Microsoft Edge, headless, local web server)
        run: python -m pytest tests -q
      - name: Build the .exe
        run: pyinstaller --onefile --name cisce-locator-saver --collect-all playwright saver.py
      - name: Smoke test of the .exe (Edge, local web server, 2 pages)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force site | Out-Null
          Copy-Item tests/pages/result-isc-india-p1.html site/index.html
          $srv = Start-Process python -ArgumentList "-m","http.server","8765","--bind","127.0.0.1","--directory","site" -PassThru
          Start-Sleep 3
          ./dist/cisce-locator-saver.exe --headless --base http://127.0.0.1:8765 --delay 0 --max-pages 2 --out smoke
          Stop-Process $srv.Id
          if (-not (Test-Path smoke/cisce_schools.csv)) { throw "no CSV" }
          $n = (Import-Csv smoke/cisce_schools.csv).Count
          if ($n -ne 10) { throw "expected 10 schools, got $n" }
      - uses: actions/upload-artifact@v6
        with:
          name: cisce-locator-saver
          path: dist/cisce-locator-saver.exe
      - name: Publish on the "latest" release
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/cisce-locator-saver.exe run-from-source.bat --title "latest" --notes "Built from ${GITHUB_SHA::7}."

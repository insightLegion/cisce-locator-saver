name: build

# Tests saver.js and saver.py on Windows, builds cisce-locator-saver.exe, and puts saver.js and the .exe on the "latest" release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:            # two pushes close together must not race on the "latest" release
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pytest playwright==1.65.2
      - name: Tests (saver.js in Microsoft Edge against a local web server; parser; CSV)
        run: python -m pytest tests -q
      - name: Build the .exe
        run: pyinstaller --onefile --name cisce-locator-saver saver.py
      - name: Smoke test of the .exe (one saved page next to it, expects 10 schools)
        shell: bash
        run: |
          python -c 'import json; json.dump({"page-0001.html": open("tests/pages/result-isc-india-p1.html", encoding="utf-8").read()}, open("dist/cisce-pages-0001-0001.json", "w", encoding="utf-8"))'
          ./dist/cisce-locator-saver.exe --out smoke < /dev/null
          python -c 'import csv; n = len(list(csv.DictReader(open("smoke/cisce_schools.csv", encoding="utf-8-sig")))); assert n == 10, n; print(n, "schools")'
      - uses: actions/upload-artifact@v6
        with:
          name: cisce-locator-saver
          path: dist/cisce-locator-saver.exe
      - name: Publish on the "latest" release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest saver.js saver.py dist/cisce-locator-saver.exe run-from-source.bat --title "latest" --notes "Built from ${GITHUB_SHA::7}."
